version: "3.9"

services:
  users-db:
    image: postgres:18
    container_name: users-db
    environment:
      POSTGRES_DB: users_db
      POSTGRES_USER: users_user
      POSTGRES_PASSWORD: users_pass
    ports:
      - "5433:5432"

  products-db:
    image: postgres:18
    container_name: products-db
    environment:
      POSTGRES_DB: products_db
      POSTGRES_USER: products_user
      POSTGRES_PASSWORD: products_pass
    ports:
      - "5434:5432"

  orders-db:
    image: postgres:18
    container_name: orders-db
    environment:
      POSTGRES_DB: orders_db
      POSTGRES_USER: postgres
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5435:5432"

  notifications-db:
    image: postgres:18
    container_name: notifications-db
    environment:
      POSTGRES_DB: notifications_db
      POSTGRES_USER: notifications_user
      POSTGRES_PASSWORD: notifications_pass
    ports:
      - "5436:5432"

  gateway-db:
    image: postgres:18
    container_name: gateway-db
    environment:
      POSTGRES_DB: gateway_db
      POSTGRES_USER: gateway_user
      POSTGRES_PASSWORD: gateway_pass
    ports:
      - "5437:5432"

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"

  users-service:
    build: ./services/users-service
    container_name: users-service
    depends_on:
      - users-db
      - products-service
      - rabbitmq
    environment:
      DATABASE_URL: postgresql+psycopg2://users_user:users_pass@users-db:5432/users_db
      PRODUCTS_SERVICE_URL: http://products-service:8002
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
    ports:
      - "8001:8001"

  products-service:
    build: ./services/products-service
    container_name: products-service
    depends_on:
      - products-db
      - rabbitmq
    environment:
      DATABASE_URL: postgresql+psycopg2://products_user:products_pass@products-db:5432/products_db
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
    ports:
      - "8002:8002"

  notifications-service:
    build: ./services/notifications-service
    container_name: notifications-service
    depends_on:
      - notifications-db
      - rabbitmq
    environment:
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
    ports:
      - "8003:8003"

  auth-service:
    build: ./services/auth-service
    container_name: auth-service
    depends_on:
      - users-service
      - rabbitmq
    environment:
      USERS_SERVICE_URL: http://users-service:8001
      JWT_SECRET_KEY: dev-secret
      JWT_ISSUER: auth-service
      JWT_EXPIRES_SECONDS: 3600
    ports:
      - "8004:8004"

  orders-service:
    build: ./services/orders-service
    container_name: orders-service
    depends_on:
      - orders-db
      - users-service
      - products-service
      - notifications-service
      - auth-service
      - rabbitmq
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres@orders-db:5432/orders_db
      JWT_SECRET_KEY: dev-secret
      JWT_ISSUER: auth-service
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
    ports:
      - "8000:8000"

  api-gateway:
    build: ./services/api-gateway-service
    container_name: api-gateway
    depends_on:
      - gateway-db
      - auth-service
      - rabbitmq
    environment:
      DATABASE_URL: postgresql+psycopg2://gateway_user:gateway_pass@gateway-db:5432/gateway_db
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      AUTH_SERVICE_URL: http://auth-service:8004
      JWT_SECRET_KEY: dev-secret
      JWT_ISSUER: auth-service
    ports:
      - "8080:8080"
