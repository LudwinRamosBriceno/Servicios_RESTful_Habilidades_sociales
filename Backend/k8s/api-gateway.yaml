# Despliegue del API Gateway (FastAPI).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: api-gateway-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: DATABASE_URL
              value: postgresql+psycopg2://gateway_user:gateway_pass@gateway-db:5432/gateway_db
            - name: RABBITMQ_URL
              value: amqp://guest:guest@rabbitmq:5672/
            - name: AUTH_SERVICE_URL
              value: http://auth-service:8004
            - name: JWT_SECRET_KEY
              value: dev-secret
            - name: JWT_ISSUER
              value: auth-service
---
# Servicio NodePort para exponer el API Gateway.
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
spec:
  selector:
    app: api-gateway
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
      nodePort: 30090
  type: NodePort
