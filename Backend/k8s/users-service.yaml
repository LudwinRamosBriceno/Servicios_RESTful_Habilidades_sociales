# Despliegue de la API de usuarios.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: users-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: users-service
  template:
    metadata:
      labels:
        app: users-service
    spec:
      containers:
        - name: users-service
          image: users-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8001
          startupProbe:
            httpGet:
              path: /health
              port: 8001
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 3
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 3
          env:
            # Conexion a la base de datos.
            - name: DATABASE_URL
              value: postgresql+psycopg2://users_user:users_pass@users-db:5432/users_db
            # Consulta HTTP para nombres de habilidades (se mantiene para lecturas).
            - name: PRODUCTS_SERVICE_URL
              value: http://products-service:8002
            # Broker RabbitMQ para consumo de eventos.
            - name: RABBITMQ_URL
              value: amqp://guest:guest@rabbitmq:5672/
---
# Servicio interno del cluster para users-service.
apiVersion: v1
kind: Service
metadata:
  name: users-service
spec:
  selector:
    app: users-service
  ports:
    - protocol: TCP
      port: 8001
      targetPort: 8001
  type: ClusterIP
