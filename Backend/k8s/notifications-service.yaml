# Despliegue del servicio de notificaciones (log de actualizaciones de usuario).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notifications-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notifications-service
  template:
    metadata:
      labels:
        app: notifications-service
    spec:
      containers:
        - name: notifications-service
          image: notifications-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8003
          env:
            # Broker RabbitMQ para consumo de eventos.
            - name: RABBITMQ_URL
              value: amqp://guest:guest@rabbitmq:5672/
---
# Servicio interno del cluster para notifications-service.
apiVersion: v1
kind: Service
metadata:
  name: notifications-service
spec:
  selector:
    app: notifications-service
  ports:
    - protocol: TCP
      port: 8003
      targetPort: 8003
  type: ClusterIP
