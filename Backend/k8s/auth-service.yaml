# Despliegue del servicio de auth (login + emision JWT).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
        - name: auth-service
          image: auth-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8004
          env:
            # URL del users-service para verificacion de credenciales.
            - name: USERS_SERVICE_URL
              value: http://users-service:8001
            # Broker RabbitMQ (reservado para futuros eventos de auth).
            - name: RABBITMQ_URL
              value: amqp://guest:guest@rabbitmq:5672/
            # Configuracion JWT.
            - name: JWT_SECRET_KEY
              value: dev-secret
            - name: JWT_ISSUER
              value: auth-service
            - name: JWT_EXPIRES_SECONDS
              value: "3600"
---
# Servicio interno del cluster para auth-service.
apiVersion: v1
kind: Service
metadata:
  name: auth-service
spec:
  selector:
    app: auth-service
  ports:
    - protocol: TCP
      port: 8004
      targetPort: 8004
  type: ClusterIP
