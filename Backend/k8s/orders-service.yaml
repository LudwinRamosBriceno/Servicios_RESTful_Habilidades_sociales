# Despliegue de la API de ordenes (publica pedido.creado).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orders-service
  template:
    metadata:
      labels:
        app: orders-service
    spec:
      containers:
        - name: orders-service
          image: orders-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            # Broker RabbitMQ para publicar/consumir eventos.
            - name: RABBITMQ_URL
              value: amqp://guest:guest@rabbitmq:5672/
            # Configuracion de BD y JWT.
            - name: DATABASE_URL
              value: postgresql+psycopg2://postgres@orders-db:5432/orders_db
            - name: JWT_SECRET_KEY
              value: dev-secret
            - name: JWT_ISSUER
              value: auth-service
---
# Servicio interno del cluster para orders-service.
apiVersion: v1
kind: Service
metadata:
  name: orders-service
spec:
  selector:
    app: orders-service
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
  type: ClusterIP
